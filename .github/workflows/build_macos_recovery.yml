name: macOS stream recovery build

on:
  push:
    branches: [fix/douyu-stream-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true
      - name: Install FVM
        run: |
          dart pub global activate fvm 4.3.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Restore dependencies
        working-directory: simple_live_app
        run: |
          fvm install
          fvm flutter config --enable-macos-desktop
          fvm flutter pub get
      - name: Check formatting
        working-directory: simple_live_app
        run: fvm dart format --output=none --set-exit-if-changed lib/modules/live_room/live_room_controller.dart lib/modules/live_room/live_room_page.dart test/douyu_playback_recovery_test.dart
      - name: Analyze
        working-directory: simple_live_app
        run: fvm flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: simple_live_app
        run: fvm flutter test
      - name: Build macOS
        working-directory: simple_live_app
        run: fvm flutter build macos --release
      - name: Package macOS
        working-directory: simple_live_app
        run: |
          mkdir -p build/dist build/dmg
          ditto -c -k --sequesterRsrc --keepParent 'build/macos/Build/Products/Release/Simple Live.app' build/dist/Simple-Live-douyu-fix-macos.zip
          ditto 'build/macos/Build/Products/Release/Simple Live.app' 'build/dmg/Simple Live.app'
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'Simple Live' -srcfolder build/dmg -ov -format UDZO build/dist/Simple-Live-douyu-fix-macos.dmg
          shasum -a 256 build/dist/*.zip build/dist/*.dmg > build/dist/SHA256SUMS.txt
          printf 'Commit: %s\nBranch: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > build/dist/BUILD.txt
          lipo -archs 'build/macos/Build/Products/Release/Simple Live.app/Contents/MacOS/Simple Live' >> build/dist/BUILD.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-douyu-fix-macos
          path: simple_live_app/build/dist/
          if-no-files-found: error
          retention-days: 30
